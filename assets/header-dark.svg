<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Gabriel Sá da Silveira: Front-end, E-commerce and Machine Learning">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a08"/><stop offset="1" stop-color="#102018"/></linearGradient>
<linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c46a" stop-opacity=".35"/><stop offset="1" stop-color="#e9c46a" stop-opacity="0"/></linearGradient>
<pattern id="gr" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.06)"/></pattern>
<clipPath id="rc"><rect width="1200" height="320" rx="18"/></clipPath>
</defs>
<style>
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.pod{animation-name:float;animation-iteration-count:infinite;animation-timing-function:ease-in-out;opacity:.18}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -14px}}
.in{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
.role{opacity:0;animation:cycle 12s infinite}
.r2{animation-delay:4s} .r3{animation-delay:8s}
@keyframes cycle{0%{opacity:0;translate:0 10px}4%,29%{opacity:1;translate:0 0}33%,100%{opacity:0;translate:0 -10px}}
.line{fill:none;stroke:#e9c46a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 3.2s .4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area{opacity:0;animation:fade 1.5s 2.6s forwards}
@keyframes fade{to{opacity:1}}
.dot{fill:#070a08;stroke:#e9c46a;stroke-width:2.5;opacity:0;animation:pop .5s forwards}
@keyframes pop{0%{opacity:0;r:0}70%{opacity:1;r:6}100%{opacity:1;r:4}}
.pulse{fill:#e9c46a;animation:pulse 2s 3.6s infinite;opacity:0}
@keyframes pulse{0%{opacity:.6;r:4}100%{opacity:0;r:18}}
.yr{font:11px 'SFMono-Regular',Consolas,monospace;fill:#a8a29e;text-anchor:middle}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<g clip-path="url(#rc)">
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#gr)"/>
<g class="pod" style="animation-duration:9.3s;animation-delay:-6.6s" transform="translate(663 97) rotate(-28) scale(0.74)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:10.5s;animation-delay:-0.7s" transform="translate(748 49) rotate(13) scale(1.05)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:12.0s;animation-delay:-6.6s" transform="translate(143 143) rotate(-25) scale(0.55)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:11.8s;animation-delay:-7.8s" transform="translate(457 51) rotate(-35) scale(0.85)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:10.0s;animation-delay:-0.9s" transform="translate(1140 88) rotate(-1) scale(0.67)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:13.0s;animation-delay:-1.5s" transform="translate(1147 112) rotate(-28) scale(0.56)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:13.3s;animation-delay:-4.0s" transform="translate(1121 52) rotate(28) scale(0.84)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:15.5s;animation-delay:-2.9s" transform="translate(875 180) rotate(-9) scale(0.78)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:11.1s;animation-delay:-4.0s" transform="translate(368 144) rotate(3) scale(0.55)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:9.5s;animation-delay:-4.1s" transform="translate(919 167) rotate(-19) scale(0.87)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:12.0s;animation-delay:-7.7s" transform="translate(700 97) rotate(-31) scale(1.06)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:11.5s;animation-delay:-4.0s" transform="translate(1142 180) rotate(18) scale(0.70)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:12.3s;animation-delay:-5.3s" transform="translate(140 67) rotate(-33) scale(1.07)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g><g class="pod" style="animation-duration:11.7s;animation-delay:-5.3s" transform="translate(634 248) rotate(-38) scale(0.67)"><ellipse cx="-5" cy="0" rx="5" ry="8" fill="#e9c46a"/><ellipse cx="6" cy="0" rx="5" ry="8" fill="#7bd389"/></g>
<text x="64" y="92" class="mono in" font-size="15" fill="#e9c46a" letter-spacing="3">HI THERE, I'M<tspan class="caret"> _</tspan></text>
<text x="60" y="160" class="serif in" font-size="64" fill="#fafaf9" style="animation-delay:.15s">Gabriel <tspan font-style="italic" fill="#e9c46a">Sá</tspan></text>
<g class="sans" font-size="24" fill="#fafaf9">
<text x="64" y="208" class="role">Front-end &amp; E-commerce Developer</text>
<text x="64" y="208" class="role r2">Shopify · WordPress · React · TypeScript</text>
<text x="64" y="208" class="role r3">Machine Learning for Agriculture 🌱</text>
</g>
<text x="64" y="256" class="mono in" font-size="14" fill="#a8a29e" style="animation-delay:.5s">MSc Agricultural Engineering · Anápolis, Brazil · open to remote</text>
<text x="700" y="68" class="mono in" font-size="12" fill="#a8a29e" letter-spacing="1.5" style="animation-delay:.3s">SOYBEAN YIELD IN GOIÁS · KG/HA · MY MSc RESEARCH</text>
